[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "replaylab"
version = "0.2.0"
description = "Compare flights recorded as Tacview text ACMI (MiG Alley, Battle of Britain, FreeFalcon), GPL Replay Analyzer style"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "PyQt6", "pyqtgraph>=0.13", "PyOpenGL"]

[project.scripts]
replaylab = "replaylab.cli:entry"

[tool.setuptools]
packages = ["replaylab"]
